name: orqesta-vendor-sync

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: orqesta-vendor-sync-master
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false

      - name: Synchronize Go modules and vendor
        run: ./hack/vendor.sh all

      - name: Verify vendored runtime dependencies
        run: |
          go list -mod=vendor ./daemon/cluster
          git diff --check

      - name: Commit generated dependencies
        run: |
          git add go.mod go.sum api/go.mod api/go.sum client/go.mod client/go.sum man/go.mod man/go.sum vendor
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: synchronize vendored dependencies with pinned SwarmKit"
            git push origin HEAD:master
          fi

      - name: Validate synchronized revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref master
          gh workflow run test.yml --ref master
